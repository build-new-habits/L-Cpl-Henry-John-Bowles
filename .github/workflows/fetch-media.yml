name: Fetch media (one-off)
on:
  push:
    branches: [fetch-charabanc]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look up candidates
        run: |
          mkdir -p fetched
          UA="QuietSoldierExhibit/1.0 (https://build-new-habits.github.io/L-Cpl-Henry-John-Bowles/)"
          curl -sSL -A "$UA" "https://commons.wikimedia.org/w/api.php?action=query&generator=categorymembers&gcmtitle=Category:Charabancs&gcmtype=file&gcmlimit=200&prop=imageinfo&iiprop=url|size|extmetadata&iiurlwidth=1600&format=json" -o fetched/commons-charabancs.json || true
          curl -sSL -A "$UA" "https://commons.wikimedia.org/w/api.php?action=query&list=categorymembers&cmtitle=Category:Charabancs&cmtype=subcat&cmlimit=200&format=json" -o fetched/commons-subcats.json || true
          curl -sSL -A "$UA" "https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrsearch=charabanc%20outing&gsrlimit=100&prop=imageinfo&iiprop=url|size|extmetadata&iiurlwidth=1600&format=json" -o fetched/commons-search.json || true
          ls -la fetched
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add fetched
          git commit -m "Charabanc candidates (lookup)" || exit 0
          git push
