name: Fetch media (one-off)
on:
  push:
    branches: [fetch-charabanc]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          curl -fsSL -A "Mozilla/5.0" -o assets/img/charabanc-bournemouth-1920.jpg "https://cdn2.picryl.com/photo/1930/12/31/c1920-real-photo-postcard-of-royal-blue-line-charabanc-at-bournemouth-hankinson-acabb1-1024.jpg"
          file assets/img/charabanc-bournemouth-1920.jpg
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add assets/img/charabanc-bournemouth-1920.jpg
          git commit -m "Add public domain charabanc postcard (fetched)"
          git push
